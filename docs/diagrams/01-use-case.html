<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyncHub — Use Case &amp; Capability Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-soft:   #5a6580;
      --color-accent: #bf4520;
      --color-link:   #2e5aa8;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Noto Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ARCHITECTURE &amp; USE CASE MAP · SYNCHUB</p>
    <h1>Bản đồ Tác nhân &amp; 12 Use Case Tích hợp (UC01 – UC12)</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="uc-map-title uc-map-desc">
        <title id="uc-map-title">Bản đồ Tác nhân và 12 Use Case SyncHub</title>
        <desc id="uc-map-desc">Sơ đồ phân quyền 4 tác nhân (HOST, MEMBER, PROVIDER, ADMIN) kết nối vào 5 cụm năng lực chứa 12 Use Cases từ UC01 đến UC12.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <!-- 1. Paper Background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- 2. Zones -->
        <rect x="40" y="36" width="216" height="476" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="56" y="40" width="144" height="12" rx="2" fill="#f5f5f5"/>
        <text x="128" y="49" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">4 ACTORS (RBAC)</text>

        <rect x="336" y="36" width="584" height="476" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="352" y="40" width="232" height="12" rx="2" fill="#f5f5f5"/>
        <text x="468" y="49" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SYNCHUB SYSTEM BOUNDARY (12 USE CASES)</text>

        <!-- 3. Orthogonal Connectors (drawn before nodes) -->
        <!-- HOST (x=236) -> C1 Discovery & Lock (x=368, y=104) -->
        <line x1="236" y1="96" x2="368" y2="96" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- HOST (x=236, y=116) -> C2 Lobby & Cart (x=368, y=184) -->
        <path d="M 236,116 H 296 Q 304,116 304,124 V 176 Q 304,184 312,184 H 368" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- HOST (x=236, y=132) -> C3 SplitBill & QR (x=368, y=280) -->
        <path d="M 236,132 H 280 Q 288,132 288,140 V 272 Q 288,280 296,280 H 368" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- MEMBER (x=236, y=204) -> C2 Lobby & Cart (x=368, y=204) -->
        <line x1="236" y1="204" x2="368" y2="204" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- MEMBER (x=236, y=224) -> C3 SplitBill & QR (x=368, y=300) -->
        <path d="M 236,224 H 316 Q 324,224 324,232 V 292 Q 324,300 332,300 H 368" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- PROVIDER (x=236, y=328) -> C4 Escrow & Checkin (x=368, y=384) -->
        <path d="M 236,328 H 304 Q 312,328 312,336 V 376 Q 312,384 320,384 H 368" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- PROVIDER (x=236, y=348) -> C5 Dispute & Portal (x=368, y=456) -->
        <path d="M 236,348 H 288 Q 296,348 296,356 V 448 Q 296,456 304,456 H 368" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ADMIN (x=236, y=444) -> C5 Dispute & Portal (x=368, y=476) -->
        <path d="M 236,444 H 316 Q 324,444 324,452 V 468 Q 324,476 332,476 H 368" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Internal <<include>> / <<extend>> chains on the right side (x=888) -->
        <!-- C2 (y=196) -> C3 (y=288) : <<include>> -->
        <path d="M 628,236 V 264" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="640" y="242" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="674" y="251" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INCLUDE</text>

        <!-- C3 (y=332) -> C4 (y=360) : <<include>> -->
        <path d="M 628,332 V 360" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="640" y="338" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="674" y="347" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INCLUDE</text>

        <!-- C5 (y=432) -> C4 (y=404) : <<extend>> -->
        <path d="M 628,432 V 404" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="640" y="410" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="672" y="419" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXTEND</text>

        <!-- 4. Actor Nodes (Left Column: x=60, w=176, h=68) -->
        <!-- Actor 1: HOST -->
        <rect x="60" y="72" width="176" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="60" y="72" width="176" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="68" y="78" width="36" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
        <text x="86" y="87" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACTOR</text>
        <text x="148" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HOST (Trưởng nhóm)</text>
        <text x="148" y="126" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UC01–04, UC06–10</text>

        <!-- Actor 2: MEMBER -->
        <rect x="60" y="176" width="176" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="60" y="176" width="176" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="68" y="182" width="36" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
        <text x="86" y="191" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACTOR</text>
        <text x="148" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MEMBER (Thành viên)</text>
        <text x="148" y="230" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UC01–02, UC05–06, UC09, UC11</text>

        <!-- Actor 3: PROVIDER -->
        <rect x="60" y="296" width="176" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="60" y="296" width="176" height="68" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <rect x="68" y="302" width="36" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
        <text x="86" y="311" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACTOR</text>
        <text x="148" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PROVIDER (Sân / Quán)</text>
        <text x="148" y="350" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">VENUE (-8%) · FNB (-12%)</text>

        <!-- Actor 4: ADMIN -->
        <rect x="60" y="408" width="176" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="60" y="408" width="176" height="68" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <rect x="68" y="414" width="36" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
        <text x="86" y="423" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACTOR</text>
        <text x="148" y="444" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ADMIN (Quản trị viên)</text>
        <text x="148" y="462" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UC01, UC11, UC12 (Audit)</text>

        <!-- 5. Capability Cluster Nodes (Right Column: x=368, w=520, h=68) -->
        <!-- Cluster 1: UC01 - UC03 -->
        <rect x="368" y="68" width="520" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="368" y="68" width="520" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="380" y="76" width="60" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
        <text x="410" y="85" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UC01–UC03</text>
        <text x="628" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Khám phá Bản đồ &amp; Giữ chỗ Slot Nguyên tử (BookSlot)</text>
        <text x="628" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UC01 Auth/Uy tín · UC02 Map Leaflet · UC03 Lock Slot 10m (BR-SLT-01/02)</text>

        <!-- Cluster 2: UC04 - UC07 (FOCAL CORAL 1) -->
        <rect x="368" y="168" width="520" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="368" y="168" width="520" height="68" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
        <rect x="380" y="176" width="60" height="12" rx="2" fill="none" stroke="rgba(191,69,32,0.5)" stroke-width="0.8"/>
        <text x="410" y="185" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UC04–UC07</text>
        <text x="628" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phòng Ghép kèo, Cọc Uy tín &amp; Giỏ hàng Realtime (GroupOrder)</text>
        <text x="628" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UC04 Invite QR · UC05 Cọc A/B/C · UC06 Socket Cart/Chat · UC07 Gợi ý &amp; CROSS</text>

        <!-- Cluster 3: UC08 - UC09 (FOCAL CORAL 2) -->
        <rect x="368" y="264" width="520" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="368" y="264" width="520" height="68" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
        <rect x="380" y="272" width="60" height="12" rx="2" fill="none" stroke="rgba(191,69,32,0.5)" stroke-width="0.8"/>
        <text x="410" y="281" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UC08–UC09</text>
        <text x="628" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chốt đơn, Chia Bill (Largest Remainder) &amp; Thanh toán VietQR</text>
        <text x="628" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UC08 SplitBill (BR-INT-02, BR-INT-04) · UC09 Webhook &amp; Giữ tiền Escrow HOLD</text>

        <!-- Cluster 4: UC10 -->
        <rect x="368" y="360" width="520" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="368" y="360" width="520" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="380" y="368" width="44" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
        <text x="402" y="377" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UC10</text>
        <text x="640" y="380" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Check-in &amp; Giải ngân Đa bên (BR-ESC-02/03, BR-REP-02/03)</text>
        <text x="640" y="396" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Tách VENUE (-8%) &amp; FNB (-12%) · Chống giải ngân trùng (idempotency_key)</text>

        <!-- Cluster 5: UC11 - UC12 -->
        <rect x="368" y="432" width="520" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="368" y="432" width="520" height="64" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <rect x="380" y="440" width="60" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
        <text x="410" y="449" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UC11–UC12</text>
        <text x="628" y="462" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Khiếu nại Dịch vụ, Portal Đối tác &amp; Admin Dashboard</text>
        <text x="628" y="482" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UC11 Đóng băng FROZEN &amp; Phân xử (BR-ESC-04, BR-DSP-01) · UC12 Recharts &amp; Audit</text>

        <!-- 6. Horizontal Bottom Legend Strip (y=540..576) -->
        <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <rect x="40" y="552" width="12" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
        <text x="60" y="562" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Cụm Use Case trọng tâm (GroupOrder &amp; SplitBill)</text>

        <line x1="340" y1="558" x2="368" y2="558" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="376" y="562" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Tương tác chính của Người dùng</text>

        <line x1="576" y1="558" x2="604" y2="558" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="612" y="562" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Quan hệ &lt;&lt;include&gt;&gt; / &lt;&lt;extend&gt;&gt;</text>
      </svg>
    </div>
  </div>
</body>
</html>
