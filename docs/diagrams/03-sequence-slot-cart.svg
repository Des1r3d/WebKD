<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seq-slot-title seq-slot-desc" id="d-03-sequence-slot-cart-root">
        <title id="seq-slot-title">Sơ đồ tuần tự Khóa Slot, Giỏ hàng Realtime và Giải ngân</title>
        <desc id="seq-slot-desc">Tương tác thời gian thực giữa 4 lifelines (HOST, MEMBER, EXPRESS + SOCKET.IO, POSTGRESQL) qua 12 thông điệp và 1 khung ALT chống đặt trùng slot.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-03-sequence-slot-cart-root { --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-soft:   #5a6580;
      --color-accent: #bf4520;
      --color-link:   #2e5aa8;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Noto Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace; }
      #d-03-sequence-slot-cart-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-03-sequence-slot-cart-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-03-sequence-slot-cart-root .diagram-container { overflow-x: visible; }</style>
          <marker id="d-03-sequence-slot-cart-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="d-03-sequence-slot-cart-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="d-03-sequence-slot-cart-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
          <marker id="d-03-sequence-slot-cart-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
          </marker>
        </defs>

        <!-- 1. Paper Background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- 2. Lifelines (x = 160, 464, 784, 1104) -->
        <line x1="160" y1="96" x2="160" y2="628" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4"/>
        <line x1="464" y1="96" x2="464" y2="628" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4"/>
        <line x1="784" y1="96" x2="784" y2="628" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4"/>
        <line x1="1104" y1="96" x2="1104" y2="628" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4"/>

        <!-- 3. Combined Fragment Frame: ALT (Atomic Slot Lock Race Condition, y=124..300) -->
        <rect x="80" y="124" width="1104" height="176" rx="4" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.22"/>
        <rect x="80" y="124" width="44" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="102" y="135" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
        <text x="136" y="136" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[rowCount === 1: Slot AVAILABLE or Expired -> Lock Wins (BR-SLT-01/02)]</text>

        <!-- ALT Divider at y=236 -->
        <line x1="88" y1="236" x2="1176" y2="236" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.20"/>
        <text x="96" y="250" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[else: rowCount === 0 (Concurrent Request Losses)]</text>

        <!-- Activation Bars on EXPRESS (x=780, w=8) and POSTGRES (x=1100, w=8) -->
        <rect x="780" y="152" width="8" height="136" fill="#ececec" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="1100" y="168" width="8" height="44" fill="#ececec" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="780" y="328" width="8" height="148" fill="#ececec" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="780" y="504" width="8" height="108" fill="#ececec" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="1100" y="528" width="8" height="56" fill="#ececec" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- 4. Sequence Messages (12 messages total — within budget <= 12) -->
        <!-- M1 (y=160): HOST -> API: POST /api/slots/:id/lock -->
        <line x1="160" y1="160" x2="780" y2="160" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#d-03-sequence-slot-cart-arrow-link)"/>
        <rect x="332" y="140" width="276" height="12" rx="2" fill="#f5f5f5"/>
        <text x="470" y="149" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">01 · POST /API/SLOTS/:ID/LOCK</text>

        <!-- M2 (y=176): API -> DB: Atomic UPDATE slots WHERE AVAILABLE -->
        <line x1="788" y1="176" x2="1100" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-03-sequence-slot-cart-arrow)"/>
        <rect x="820" y="156" width="248" height="12" rx="2" fill="#f5f5f5"/>
        <text x="944" y="165" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">02 · ATOMIC UPDATE (+10M LOCK)</text>

        <!-- M3 (y=208): DB --> API: rowCount = 1 -->
        <line x1="1100" y1="208" x2="788" y2="208" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d-03-sequence-slot-cart-arrow)"/>
        <rect x="852" y="188" width="184" height="12" rx="2" fill="#f5f5f5"/>
        <text x="944" y="197" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">03 · RETURN ROWCOUNT = 1</text>

        <!-- M4 (y=220, Headline Success Coral): API -> HOST: 200 OK (Slot Locked) -->
        <line x1="780" y1="220" x2="160" y2="220" stroke="#bf4520" stroke-width="1.5" marker-end="url(#d-03-sequence-slot-cart-arrow-accent)"/>
        <rect x="340" y="200" width="260" height="12" rx="2" fill="#f5f5f5"/>
        <text x="470" y="209" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">04 · 200 OK (LOCKED_UNTIL +10M)</text>

        <!-- M5 (y=280, inside else region): API --> MEMBER: 409 Conflict SLOT_TAKEN -->
        <line x1="780" y1="280" x2="464" y2="280" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d-03-sequence-slot-cart-arrow)"/>
        <rect x="504" y="260" width="236" height="12" rx="2" fill="#f5f5f5"/>
        <text x="622" y="269" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">05 · 409 CONFLICT (SLOT_TAKEN)</text>

        <!-- M6 (y=340): MEMBER -> API: Socket cart:add { lobbyId, menuItemId, qty } -->
        <line x1="464" y1="340" x2="780" y2="340" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#d-03-sequence-slot-cart-arrow-link)"/>
        <rect x="496" y="320" width="252" height="12" rx="2" fill="#f5f5f5"/>
        <text x="622" y="329" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">06 · SOCKET EMIT CART:ADD</text>

        <!-- M7 (y=384): API ->> Room (HOST & MEMBER): Async broadcast cart:updated -->
        <line x1="780" y1="384" x2="160" y2="384" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d-03-sequence-slot-cart-arrow-open)"/>
        <rect x="284" y="364" width="256" height="12" rx="2" fill="#f5f5f5"/>
        <text x="412" y="373" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">07 · BROADCAST CART:UPDATED (&lt;1S)</text>

        <!-- M8 (y=428): HOST -> API: POST /api/lobbies/:id/split (Lock + SplitBill) -->
        <line x1="160" y1="428" x2="780" y2="428" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#d-03-sequence-slot-cart-arrow-link)"/>
        <rect x="324" y="408" width="292" height="12" rx="2" fill="#f5f5f5"/>
        <text x="470" y="417" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">08 · POST /SPLIT (LOCK &amp; SPLITBILL)</text>

        <!-- M9 (y=468): API ->> MEMBER: Broadcast lobby:locked & bill:ready (VietQR) -->
        <line x1="780" y1="468" x2="464" y2="468" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d-03-sequence-slot-cart-arrow-open)"/>
        <rect x="492" y="448" width="260" height="12" rx="2" fill="#f5f5f5"/>
        <text x="622" y="457" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">09 · EMIT LOBBY:LOCKED &amp; VIETQR</text>

        <!-- M10 (y=516): MEMBER -> API: POST /api/payments/webhook-mock -->
        <line x1="464" y1="516" x2="780" y2="516" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#d-03-sequence-slot-cart-arrow-link)"/>
        <rect x="496" y="496" width="252" height="12" rx="2" fill="#f5f5f5"/>
        <text x="622" y="505" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">10 · POST /PAYMENTS/WEBHOOK-MOCK</text>

        <!-- M11 (y=556): API -> DB: HOLD & Check-in Multi-party Release (idempotency_key) -->
        <line x1="788" y1="556" x2="1100" y2="556" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-03-sequence-slot-cart-arrow)"/>
        <rect x="808" y="536" width="272" height="12" rx="2" fill="#f5f5f5"/>
        <text x="944" y="545" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">11 · ESCROW HOLD -&gt; RELEASE (IDEMPOTENT)</text>

        <!-- M12 (y=600, Headline Success Coral 2): API -> HOST: Broadcast escrow:released -->
        <line x1="780" y1="600" x2="160" y2="600" stroke="#bf4520" stroke-width="1.5" marker-end="url(#d-03-sequence-slot-cart-arrow-accent)"/>
        <rect x="316" y="580" width="308" height="12" rx="2" fill="#f5f5f5"/>
        <text x="470" y="589" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">12 · ESCROW:RELEASED (VENUE 92% · FNB 88%)</text>

        <!-- 5. Top Participant Boxes (drawn after lifelines, y=36, h=60, w=200) -->
        <!-- Lifeline 1: HOST -->
        <rect x="60" y="36" width="200" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="60" y="36" width="200" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="68" y="42" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.4"/>
        <text x="86" y="51" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACTOR</text>
        <text x="160" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HOST (Trưởng nhóm)</text>
        <text x="160" y="84" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Client Browser / Mobile</text>

        <!-- Lifeline 2: MEMBER -->
        <rect x="364" y="36" width="200" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="364" y="36" width="200" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="372" y="42" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.4"/>
        <text x="390" y="51" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACTOR</text>
        <text x="464" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MEMBER (Thành viên)</text>
        <text x="464" y="84" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">QR Join &amp; Socket Room</text>

        <!-- Lifeline 3: EXPRESS + SOCKET.IO -->
        <rect x="684" y="36" width="200" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="684" y="36" width="200" height="60" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.08"/>
        <rect x="692" y="42" width="36" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.5"/>
        <text x="710" y="51" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API/WS</text>
        <text x="784" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Express + Socket.io</text>
        <text x="784" y="84" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">slotLock · splitBill · escrow</text>

        <!-- Lifeline 4: POSTGRESQL -->
        <rect x="1004" y="36" width="200" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="1004" y="36" width="200" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="1012" y="42" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.4"/>
        <text x="1030" y="51" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="1104" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL 16 (Prisma)</text>
        <text x="1104" y="84" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ACID Tx &amp; Unique Keys</text>

        <!-- 6. Horizontal Bottom Legend Strip (y=652..688) -->
        <line x1="60" y1="648" x2="1204" y2="648" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
        <line x1="60" y1="670" x2="92" y2="670" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#d-03-sequence-slot-cart-arrow-link)"/>
        <text x="100" y="674" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Gọi đồng bộ (REST / Socket Emit)</text>

        <line x1="340" y1="670" x2="372" y2="670" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d-03-sequence-slot-cart-arrow)"/>
        <text x="380" y="674" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Phản hồi đồng bộ (Return)</text>

        <line x1="584" y1="670" x2="616" y2="670" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d-03-sequence-slot-cart-arrow-open)"/>
        <text x="624" y="674" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Broadcast bất đồng bộ (Room Event)</text>

        <line x1="880" y1="670" x2="912" y2="670" stroke="#bf4520" stroke-width="1.5" marker-end="url(#d-03-sequence-slot-cart-arrow-accent)"/>
        <text x="920" y="674" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Kết quả thành công trọng tâm (Headline Success)</text>
      </svg>
