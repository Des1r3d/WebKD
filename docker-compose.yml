version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: synchub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: synchub
      POSTGRES_PASSWORD: synchub_password
      POSTGRES_DB: synchub_db
    ports:
      - "5432:5432"
    volumes:
      - synchub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synchub -d synchub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  synchub_pgdata:
